[package]
name = "cdtree"
version = "0.1.10"
edition = "2024"
default-run = "cdtree"

[[bin]]
name = "cdtree"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.57", features = ["derive"] }
crossterm = "0.29.0"
rand = "0.9.2"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dirs = "5"
